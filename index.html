<style>
/* ============================================================
   HALCYON · resume (lean)
   Layout: one column, max 920px. Sections separated by hairlines.
   One amber signal (dark) / sage (light). Everything square. No shadows.
   Edit content in the DATA block at the bottom; edit look here.
   ============================================================ */
:root{
  color-scheme:dark;
  --bg:#0D0F10; --plate:#101315; --line:#23282B; --strong:#31383C;
  --fg:#E9E7E2; --dim:#8C8F8C; --faint:#5A5E5D;
  --signal:#E3A72C; --signal-deep:#2A1F0C;
  --mono:"JetBrains Mono","Noto Sans TC",ui-monospace,Menlo,monospace;
  --max:920px;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#E7E8E4; --plate:#F2F2EF; --line:#C6C8C2; --strong:#9EA39C;
  --fg:#111312; --dim:#5E6462; --faint:#8A908C;
  --signal:#5E7A6C; --signal-deep:#DDE4DF;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#E7E8E4; --plate:#F2F2EF; --line:#C6C8C2; --strong:#9EA39C;
  --fg:#111312; --dim:#5E6462; --faint:#8A908C;
  --signal:#5E7A6C; --signal-deep:#DDE4DF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-weight:300;font-size:14px;line-height:1.85;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit;text-decoration:none;border-bottom:1px solid var(--strong)}
a:hover{color:var(--signal);border-color:var(--signal)}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0}
.wrap{max-width:var(--max);margin:0 auto}
.label{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.sig{color:var(--signal)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.mark{width:11px;height:11px;border:1px solid var(--signal);position:relative;flex:none}
.mark::after{content:"";position:absolute;inset:3px;background:var(--signal)}
.top nav{display:flex;gap:16px;margin-left:auto;color:var(--dim)}
.top nav a{border:0}
.lang{border:1px solid var(--strong);padding:3px 9px;letter-spacing:.14em;font-size:11px}
.lang:hover{border-color:var(--signal);color:var(--signal)}
@media (max-width:640px){.top nav{display:none}}

/* hero */
.hero{display:grid;grid-template-columns:1fr 180px;gap:32px;align-items:start;padding-block:56px 44px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(30px,5vw,48px);font-weight:200;letter-spacing:-.02em;line-height:1.08;margin:14px 0 14px;text-wrap:balance}
.hero p{margin:0 0 22px;color:var(--dim);max-width:62ch}
.links{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:12px}
.links a{border:0}
.links a::before{content:"› ";color:var(--signal)}
.photo{position:relative;width:100%;max-width:180px;aspect-ratio:1/1;border:1px solid var(--strong);background:var(--plate);overflow:hidden;display:grid;place-items:center;font-size:10px;letter-spacing:.14em;color:var(--faint)}
.photo img{width:100%;height:100%;object-fit:cover;filter:saturate(.75)}
.photo i{position:absolute;width:9px;height:9px;border:1px solid var(--signal)}
.photo i:nth-child(1){top:-5px;left:-5px;border-right:0;border-bottom:0}
.photo i:nth-child(2){top:-5px;right:-5px;border-left:0;border-bottom:0}
.photo i:nth-child(3){bottom:-5px;left:-5px;border-right:0;border-top:0}
.photo i:nth-child(4){bottom:-5px;right:-5px;border-left:0;border-top:0}
@media (max-width:640px){.hero{grid-template-columns:1fr}.photo{max-width:120px}}

/* sections */
section{padding-block:36px 8px}
.sec{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}

/* work */
.work{border:1px solid var(--line);background:var(--plate);margin-bottom:10px;min-width:0}
.work summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:4px 18px;align-items:baseline;padding:18px 20px}
.work summary::-webkit-details-marker{display:none}
.work summary .no{font-size:10px;letter-spacing:.2em;color:var(--faint)}
.work summary h3{margin:0;font-size:19px;font-weight:300;letter-spacing:-.01em}
.work summary .sum{grid-column:2;margin:0;color:var(--dim);font-size:13px}
.work summary .tog{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;grid-row:1;grid-column:3}
.work summary .tog::before{content:"+ "}
.work[open]{border-color:var(--signal)}
.work[open] summary .tog::before{content:"– "}
.work:hover summary .tog{color:var(--signal)}
.work .body{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;padding:4px 20px 22px;border-top:1px solid var(--line);margin-top:0}
.work .body dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
.work .body dt{color:var(--signal);letter-spacing:.2em;font-size:10px;text-transform:uppercase;padding-top:4px}
.work .body dd{margin:0}
.work .body ul{margin:0;padding-left:1.1em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{font-size:10px;letter-spacing:.12em;border:1px solid var(--strong);padding:2px 8px;color:var(--dim);text-transform:uppercase}
.shot{margin-top:14px;display:grid;gap:10px}
.shot img{width:100%;border:1px solid var(--strong);filter:saturate(.8)}
.shot .ph{aspect-ratio:16/9;border:1px solid var(--strong);background:repeating-linear-gradient(135deg,transparent 0 10px,var(--line) 10px 11px);display:grid;place-items:center;font-size:10px;letter-spacing:.14em;color:var(--faint)}
@media (max-width:640px){.work .body{grid-template-columns:1fr}.work summary{grid-template-columns:1fr auto}.work summary .no,.work summary h3,.work summary .sum{grid-column:1}.work summary .tog{grid-column:2}}

/* education / publications: rows */
.row{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.row .yr{color:var(--signal);letter-spacing:.12em;font-size:11px;padding-top:3px;font-variant-numeric:tabular-nums}
.row b{font-weight:400;display:block}
.row span{color:var(--dim)}

/* skills */
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:0 28px}
.skills div{padding:10px 0 14px;border-top:1px solid var(--line)}
.skills h4{margin:0 0 6px;font-weight:400}
.skills p{margin:0;font-size:13px;color:var(--fg)}
@media (max-width:640px){.skills{grid-template-columns:1fr}}

/* footer */
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 28px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
footer b{font-weight:400;color:var(--fg)}
:focus-visible{outline:1px solid var(--signal);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

                            en: "NTU College of Life Science International Academic Exchange Scholarship · Tri-University Alliance Architectural Photography Course, 1st place" }, href: "" },
    { year: "2022", text: { zh: "中研院 NPAS 暑期大專生計畫成果發表 第五名", en: "Academia Sinica NPAS Summer Undergraduate Research Program, 5th place" }, href: "" },
  ],

  ui: {
    nav:  [ { id: "work", zh: "作品", en: "Work" }, { id: "edu", zh: "學歷", en: "Education" }, { id: "skills", zh: "技能", en: "Skills" }, { id: "pub", zh: "發表", en: "Publications" } ],
    sec:  { work: { zh: "研究與專案", en: "Research & projects" }, edu: { zh: "學歷", en: "Education" }, skills: { zh: "技能", en: "Skills" }, pub: { zh: "發表、專利與獲獎", en: "Publications, patents & awards" } },
    dl:   { problem: { zh: "問題", en: "Problem" }, role: { zh: "角色", en: "Role" }, method: { zh: "做法", en: "Method" }, result: { zh: "成果", en: "Result" } },
    tog:  { zh: "詳情", en: "Details" }, photo: "[ PHOTO ]", shot: "[ SCREENSHOT ]"
  }
};

/* ============================================================ render ============================================================ */
(function(){
  let lang = "zh";
  try { lang = localStorage.getItem("lang") || "zh"; } catch(e){}
  const t = v => (v == null) ? "" : (typeof v === "string" ? v : (v[lang] || v.zh || ""));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const img = (src, ph) => src ? `<img src="${esc(src)}" alt="">` : `<div class="ph">${ph}</div>`;
  const $ = id => document.getElementById(id);

  function render(){
    const d = DATA, u = d.ui;
    document.documentElement.lang = lang === "en" ? "en" : "zh-Hant";
    $("brand").textContent = t(d.name);
    $("langbtn").textContent = lang === "en" ? "中" : "EN";
    $("nav").innerHTML = u.nav.map(n => `<a href="#${n.id}">${esc(t(n))}</a>`).join("");

    $("hero").innerHTML = `
      <div>
        <div class="label">// <span class="sig">${esc(t(d.role))}</span></div>
        <h1>${esc(t(d.headline))}</h1>
        <p>${esc(t(d.intro))}</p>
        <div class="links">${d.links.map(l => `<a href="${esc(l.href)}">${esc(l.text)}</a>`).join("")}</div>
      </div>
      <div class="photo"><i></i><i></i><i></i><i></i>${d.photo ? `<img src="${esc(d.photo)}" alt="${esc(t(d.name))}">` : u.photo}</div>`;

    $("work").innerHTML = `<div class="sec"><span class="label">SEC 01 · ${esc(t(u.sec.work))}</span></div>` +
      d.work.map((w, i) => {
        const dl = ["problem","role","method","result"].map(k => {
          const v = t(w[k]); if (!v || (Array.isArray(v) && !v.length)) return "";
          const body = Array.isArray(v) ? `<ul>${v.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : esc(v);
          return `<dt>${esc(t(u.dl[k]))}</dt><dd>${body}</dd>`;
        }).join("");
        const links = (w.links||[]).filter(l => l.href).map(l => `<a href="${esc(l.href)}">${esc(l.text)}</a>`).join(" · ");
        const shots = (w.shots||[]).map(s => img(s, u.shot)).join("");
        return `<details class="work"${w.open ? " open" : ""}>
          <summary><span class="no">NO. ${String(i+1).padStart(2,"0")} · ${esc(w.year)}</span><h3>${esc(t(w.title))}</h3><span class="tog">${esc(t(u.tog))}</span><p class="sum">${esc(t(w.summary))}</p></summary>
          <div class="body">
            <div>${dl ? `<dl>${dl}</dl>` : ""}<div class="tags">${w.tags.map(x => `<span class="tag">${esc(x)}</span>`).join("")}</div>${links ? `<p style="margin:14px 0 0;font-size:12px">${links}</p>` : ""}</div>
            <div>${shots ? `<div class="shot">${shots}</div>` : ""}</div>
          </div></details>`;
      }).join("");

    $("edu").innerHTML = `<div class="sec"><span class="label">SEC 02 · ${esc(t(u.sec.edu))}</span></div>` +
      d.education.map(e => `<div class="row"><span class="yr">${esc(e.year)}</span><div><b>${esc(t(e.school))} · ${esc(t(e.degree))}</b>${t(e.note) ? `<span>${esc(t(e.note))}</span>` : ""}</div></div>`).join("");

    $("skills").innerHTML = `<div class="sec"><span class="label">SEC 03 · ${esc(t(u.sec.skills))}</span></div><div class="skills">` +
      d.skills.map(s => `<div><h4 class="label">${esc(t(s.group))}</h4><p>${esc(t(s.items))}</p></div>`).join("") + `</div>`;

    $("pub").innerHTML = `<div class="sec"><span class="label">SEC 04 · ${esc(t(u.sec.pub))}</span></div>` +
      d.publications.map(p => `<div class="row"><span class="yr">${esc(p.year)}</span><div>${p.href ? `<a href="${esc(p.href)}">${esc(t(p.text))}</a>` : esc(t(p.text))}</div></div>`).join("");

    $("foot").innerHTML = d.links.map(l => `<span>${esc(l.label)} <b>${esc(l.text)}</b></span>`).join("") + `<span>${esc(t(d.location))} · ${new Date().getFullYear()}</span>`;
  }

  $("langbtn").addEventListener("click", () => {
    lang = lang === "en" ? "zh" : "en";
    try { localStorage.setItem("lang", lang); } catch(e){}
    render();
  });
  render();
})();
</script>
</body>
</html>
